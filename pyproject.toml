[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-extractor"
version = "0.0.1"
description = "Table extraction for complex construction schedules, built on Table Transformer."
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "pandas>=2.0",
    "pydantic>=2.6",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
tatr = [
    "table-transformer @ git+https://github.com/microsoft/table-transformer.git@main",
]

[project.scripts]
schedule-extract = "schedule_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
